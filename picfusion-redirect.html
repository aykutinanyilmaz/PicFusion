<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicFusion AI Photo Editor | Hemen İndir</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #0F172A; /* Modern koyu tema */
            --card-bg: #1E293B;
            --text-color: #F8FAFC;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-color);
        }
        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 380px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .app-icon {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            /* Buraya gerçek logo linkini koymalısın */
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
        }
        h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 16px;
            color: #94A3B8;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 17px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
            background-color: #006ee6;
        }
        .cta-button:active {
            transform: scale(0.96);
        }
        .badge {
            margin-top: 25px;
            opacity: 0.8;
            height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/110/6366f1/ffffff?text=PicFusion" alt="PicFusion Logo" class="app-icon">
    
    <h1>PicFusion AI</h1>
    <p>AI Photo Editor ile fotoğraflarınızı saniyeler içinde sanat eserine dönüştürün.</p>

    <a href="https://apps.apple.com/ie/app/picfusion-ai-photo-editor/id6757886675" class="cta-button">
        App Store'dan Ücretsiz İndir
    </a>

    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge_White_RGB.svg" class="badge" alt="App Store Badge">
</div>

</body>
</html>
